<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Osprey</title>
  <style>
    body { margin: 0; width: 280px; font: 13px -apple-system, "Helvetica Neue", sans-serif; color: #16181C; background: #FFFFFF; }
    @media (prefers-color-scheme: dark) { body { color: #E8EAED; background: #17191E; } }
    main { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    h1 { margin: 0; font-size: 15px; }
    p { margin: 0; line-height: 1.4; }
    button { align-self: flex-start; font: inherit; padding: 6px 12px; border-radius: 8px; border: 0; background: #0A7CC4; color: #FFFFFF; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Osprey</h1>
    <p id="status" role="status" aria-live="polite">Checking…</p>
    <button id="retry" type="button">Check again</button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
